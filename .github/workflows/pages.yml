name: Map site

# Builds the public map site (site/build_map.py, T-105, D-23, D-24) from the published results and the national
# index pilot, and publishes it with GitHub Pages. Free: the repository is public (D-24). Pages must be switched on
# once in the repository settings (Settings, Pages, Source: GitHub Actions).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 14 * * 1"   # weekly, so updated results branches reach the site (T-109)

permissions:
  contents: read
  actions: read   # to fetch the national index a National index run built

env:
  # the National index run whose index the whole-country map is drawn from until the first is published (asked for by
  # the owner on 10 Nov 2026): the 21 Nov build with zoning and hazards, reviewed 22 Nov, kept to 21 Dec. Empty: the
  # newest published national index (a release national-*, D-27); set it empty once the first index is published
  NATIONAL_RUN: "44954071348"
  # Cloudflare R2 (D-26): the public address of the bucket land-query-map. With it and the secrets R2_ACCESS_KEY_ID,
  # R2_SECRET_ACCESS_KEY and R2_ACCOUNT_ID, the map is built in full for the whole country and its data goes to R2;
  # without them, the site is built as before, all on GitHub Pages
  R2_PUBLIC_URL: "https://pub-657b33c7b1204e68938a6d4f6dba1239.r2.dev"
  R2_BUCKET: land-query-map

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q duckdb pandas pyarrow shapely numpy requests "mcp==2.3.0"
      - uses: actions/download-artifact@v4
        if: env.NATIONAL_RUN != ''
        with: { name: national-index, path: national, run-id: "${{ env.NATIONAL_RUN }}", github-token: "${{ github.token }}" }
      - name: The newest published national index
        if: env.NATIONAL_RUN == ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("national-"))][0].tagName // ""')
          if [ -n "$tag" ]; then gh release download "$tag" --repo "${{ github.repository }}" --dir national; echo "drawing $tag"; else echo "no national index published yet"; fi
      - name: Can R2 be reached (before the half-hour build)
        if: env.R2_PUBLIC_URL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "R2 secrets not set"; exit 0; }
          pip install -q boto3 && python3 site/upload_r2.py check
      - name: Test and build the site
        run: |
          python3 site/test_site.py
          if [ -f national/index.parquet ]; then export LQ_NATIONAL=national; fi
          if [ -n "$R2_PUBLIC_URL" ] && [ -n "$R2_KEY" ]; then export LQ_FULL=1 LQ_DATA_URL="$R2_PUBLIC_URL"; fi
          python3 site/build_map.py _site
          du -sm _site
        env: { R2_KEY: "${{ secrets.R2_ACCESS_KEY_ID }}" }
      - name: Send the map data to R2
        if: env.R2_PUBLIC_URL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "R2 secrets not set: nothing sent"; exit 0; }
          # 128 at a time with boto3 (the AWS command line managed about 25 files a second: over an hour); each build
          # under its own folder, never changed once written; the newest three kept
          python3 site/upload_r2.py _site/data "$(cat _site/BUILD.txt)"
          rm -rf _site/data
          du -sm _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:   # only the job that publishes may publish (T-109)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 2400000   # ms; about 4,100 files can take GitHub longer than the default 10 minutes to sync
