name: Finish published results

# Applies the row rules (pipeline/overlays.py finish_row) to the published district results and republishes them,
# without recompiling any block (T-82). For fixes that only change how a parcel's own values are published: minutes,
# not a rebuild. It also reruns the council's precomputed queries. Anything that needs new source data still needs
# kapiti.yml or porirua.yml. The `council` input picks the results branch (T-97).

on:
  workflow_dispatch:
    inputs:
      council:
        description: "kapiti or porirua"
        required: false
        default: kapiti

env:
  COUNCIL: ${{ inputs.council || 'kapiti' }}

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q duckdb pandas pyarrow shapely "mcp==2.3.0"
      - name: Finish
        run: |
          git fetch -q origin $COUNCIL-results
          mkdir -p in && git archive origin/$COUNCIL-results results | tar -x -C in
          mkdir -p district && cd pipeline && python3 finish.py ../in/results ../district | tee ../district/finish_log.txt
      - name: Check the query service and the publishing rules (T-36, T-76)
        run: |
          COUNCIL=kapiti python3 pipeline/test_finish.py   # Kāpiti fixtures; it also runs a Porirua case itself
          LANDQ_RESULTS=district python3 service/test_service.py
      - name: Push results to the council's results branch
        run: |
          mkdir -p /tmp/out && cp district/{units.parquet,provenance.json,blocks.json,qa_summary.json,inverse_queries.json,summary.md,merge_log.txt,measures_checks.json,finish.json,finish_log.txt,finish_note.txt} /tmp/out/
          python3 pipeline/public_strip.py /tmp/out   # no title references or types in public results (T-106)
          git checkout -q $COUNCIL-results
          git rm -rq --cached . 2>/dev/null || true
          rm -rf results && mkdir -p results && cp /tmp/out/* results/
          echo "$(cat in/results/RUN.txt | head -1); finished by run ${{ github.run_id }} on $(date -u +%FT%TZ) at commit ${{ github.sha }} (row rules only, finish.py). $(cat district/finish_note.txt)" > results/RUN.txt
          git add results && git -c user.name="finish workflow" -c user.email="actions@github.com" \
            commit -qm "$COUNCIL finish: run ${{ github.run_id }}" && git push -q origin HEAD:$COUNCIL-results
