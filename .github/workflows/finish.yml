name: Finish published results

# Applies the row rules (pipeline/overlays.py finish_row) to the published district results and republishes them,
# without recompiling any block (T-82). For fixes that only change how a parcel's own values are published: minutes,
# not a rebuild. Anything that needs new source data still needs kapiti.yml.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q duckdb pandas pyarrow shapely "mcp==2.3.0"
      - name: Finish
        run: |
          git fetch -q origin kapiti-results
          mkdir -p in && git archive origin/kapiti-results results | tar -x -C in
          mkdir -p district && cd pipeline && python3 finish.py ../in/results ../district | tee ../district/finish_log.txt
      - name: Check the query service and the publishing rules (T-36, T-76)
        run: LANDQ_RESULTS=district python3 service/test_service.py
      - name: Push results to kapiti-results branch
        run: |
          mkdir -p /tmp/out && cp district/{units.parquet,provenance.json,blocks.json,qa_summary.json,inverse_queries.json,summary.md,merge_log.txt,measures_checks.json,finish.json,finish_log.txt} /tmp/out/
          git checkout -q kapiti-results
          git rm -rq --cached . 2>/dev/null || true
          rm -rf results && mkdir -p results && cp /tmp/out/* results/
          echo "$(cat in/results/RUN.txt | head -1); finished by run ${{ github.run_id }} on $(date -u +%FT%TZ) at commit ${{ github.sha }} (row rules only, finish.py)" > results/RUN.txt
          git add results && git -c user.name="kapiti workflow" -c user.email="actions@github.com" \
            commit -qm "Kāpiti finish: run ${{ github.run_id }}" && git push -q origin HEAD:kapiti-results
