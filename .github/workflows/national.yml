name: National index

# The national index (T-102): every parcel in New Zealand from LINZ data, built in shares of the
# 40 km tiles listed in pipeline/nz_tiles.json (`national_index.py plan` lists them again), merged, checked and
# published as a release file. Free: the repository is public (D-24). With source "bulk" (the default) one job first
# downloads every layer for the whole country (bulk.py: LINZ Data Service exports with the key, small layers from the
# ArcGIS services once), and the shares read only those files, so they make no requests to LINZ and can run 20 at once.
#
# Monthly (D-27): on the 3rd of each month it builds with the defaults, compares the result with the last published
# index (national_compare.py) and, if nothing moved further than a month of LINZ changes explains, publishes it and
# rebuilds the map. If a check fails, the build waits as an artifact for a person, who publishes it with publish_run.
# The first index is always published by a person, after a review.

on:
  schedule:
    - cron: "23 15 3 * *"   # 15:23 UTC on the 3rd: early morning in New Zealand
  workflow_dispatch:
    inputs:
      shares:
        description: "How many jobs to split the tiles over"
        required: false
        default: "40"
      source:
        description: "bulk: download each layer once for the whole country (no rate limit); service: each tile queries LINZ's services"
        type: choice
        options: [bulk, service]
        default: bulk
      stop_after_bulk:
        description: "Only download the bulk layers and check them (a test of the download)"
        type: boolean
        default: false
      reuse_run:
        description: "Build faster on an earlier run's saved work (its run id, kept 5 days): the half not chosen under redo is taken from it"
        required: false
        default: ""
      redo:
        description: "With reuse_run: which half to work out again (the other is taken as saved)"
        type: choice
        options: ["vector,elevation", "vector", "elevation"]
        default: "vector,elevation"
      merge_run:
        description: "Instead of building: merge the shares an earlier run built (its run id; shares are kept 3 days)"
        required: false
        default: ""
      publish_run:
        description: "Instead of building: publish the index an earlier run built (its run id), once it has been reviewed"
        required: false
        default: ""

permissions:
  contents: write   # the release
  actions: read     # to fetch an earlier run's index (publish_run)

jobs:
  plan:
    # the settings every later job reads: a scheduled run has no inputs, so the defaults are filled in here
    runs-on: ubuntu-latest
    outputs:
      shares: ${{ steps.s.outputs.shares }}
      n: ${{ steps.s.outputs.n }}
      source: ${{ steps.s.outputs.source }}
      build: ${{ steps.s.outputs.build }}
    steps:
      - id: s
        env: { N: "${{ inputs.shares || '40' }}", SOURCE: "${{ inputs.source || 'bulk' }}", PUB: "${{ inputs.publish_run }}", MERGE: "${{ inputs.merge_run }}" }
        run: |
          python3 -c "import json, os; print('shares=' + json.dumps(list(range(int(os.environ['N'])))))" >> "$GITHUB_OUTPUT"
          echo "n=$N" >> "$GITHUB_OUTPUT"; echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          if [ -z "$PUB$MERGE" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  bulk:
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.source == 'bulk'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Download every layer once
        working-directory: pipeline
        env: { LINZ_API_KEY: "${{ secrets.LINZ_API_KEY }}" }
        run: |
          /usr/bin/time -v -o time.txt python3 bulk.py ../bulk
          grep -h -E "Elapsed|Maximum resident" time.txt; ls -la ../bulk; cat ../bulk/manifest.json
      - uses: actions/upload-artifact@v4
        with: { name: bulk, path: bulk/, retention-days: 2, compression-level: 0 }   # parquet is compressed already

  districts:
    # official district boundaries from Stats NZ (review 26), with the STATSNZ_API_KEY secret; without it, nothing
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        env: { STATSNZ_API_KEY: "${{ secrets.STATSNZ_API_KEY }}" }
        run: |
          python3 districts.py ../districts   # no key: writes nothing and exits 0; any other problem fails the job
          ls -la ../districts 2>/dev/null || echo "no district boundaries"
      - uses: actions/upload-artifact@v4
        with: { name: districts, path: districts/, retention-days: 5, if-no-files-found: ignore }

  share:
    needs: [plan, bulk, districts]
    if: always() && needs.plan.outputs.build == 'true' && !inputs.stop_after_bulk && (needs.bulk.result == 'success' || needs.bulk.result == 'skipped') && needs.districts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ needs.plan.outputs.source == 'bulk' && 20 || 6 }}   # bulk: no requests to LINZ; service: its rate limit is shared by every job
      matrix:
        k: ${{ fromJson(needs.plan.outputs.shares) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.source == 'bulk'
        with: { name: bulk, path: bulk }
      - uses: actions/download-artifact@v4
        continue-on-error: true   # no artifact when there is no Stats NZ key
        with: { name: districts, path: districts }
      # an earlier run's work for this share: its saved halves (in share-K, under stages/)
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run != ''
        with: { name: "share-${{ matrix.k }}", path: share, run-id: "${{ inputs.reuse_run }}", github-token: "${{ github.token }}" }
      - name: Build this share
        working-directory: pipeline
        env:
          N: "${{ needs.plan.outputs.n }}"
          K: "${{ matrix.k }}"
          NI_BULK: "${{ needs.plan.outputs.source == 'bulk' && '../bulk' || '' }}"
          NI_STAGES: ../share/stages
          NI_DISTRICTS: ../districts
          NI_REDO: "${{ inputs.reuse_run != '' && inputs.redo || 'vector,elevation' }}"
        run: |
          python3 test_national.py
          rm -f ../share/index.parquet ../share/provenance.json ../share/run.json
          /usr/bin/time -v -o time.txt python3 national_index.py ../share nz nz_tiles.json "$K" "$N"   # errors stay in the log
          grep -h -E "Elapsed|Maximum resident" time.txt
          rm -rf ../share/cache   # raw downloads hold title references: never uploaded (T-106)
      - uses: actions/upload-artifact@v4
        with:
          name: share-${{ matrix.k }}
          path: share/
          retention-days: 5

  merge:
    needs: [plan, share]
    # runs after the shares whether or not the bulk job before them was skipped (a skipped job upstream would skip this
    # one too: run 42774512412 built every share and merged nothing), or alone on an earlier run's shares (merge_run)
    if: always() && inputs.publish_run == '' && (needs.share.result == 'success' || inputs.merge_run != '')
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.compare.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        if: inputs.merge_run == ''
        with: { pattern: "share-*", path: shares }
      - uses: actions/download-artifact@v4
        if: inputs.merge_run != ''
        with: { pattern: "share-*", path: shares, run-id: "${{ inputs.merge_run }}", github-token: "${{ github.token }}" }
      - name: Merge and check
        run: python3 pipeline/national_merge.py shares nz "${{ needs.plan.outputs.n }}"
      - uses: actions/upload-artifact@v4
        with: { name: national-index, path: nz/, retention-days: 30 }
      - name: Compare with the last published index
        id: compare
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("national-"))][0].tagName // ""')
          if [ -z "$tag" ]; then echo "no published index yet: the first is published by a person after a review"; echo "passed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh release download "$tag" --repo "${{ github.repository }}" --pattern index.parquet --dir last
          if python3 pipeline/national_compare.py last/index.parquet nz/index.parquet; then echo "passed=true" >> "$GITHUB_OUTPUT"
          else echo "passed=false" >> "$GITHUB_OUTPUT"; echo "::warning::differs from $tag beyond a month of changes: not published; a person looks, then runs again with publish_run"; fi

  publish:
    # by a person (publish_run: an earlier build's run id, once reviewed), or by the monthly build itself when the
    # comparison with the last published index passed (D-27)
    needs: merge
    if: always() && (inputs.publish_run != '' || (github.event_name == 'schedule' && needs.merge.outputs.passed == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
      actions: write    # to start the map site build
    env: { RUN: "${{ inputs.publish_run || github.run_id }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: national-index, path: nz, run-id: "${{ env.RUN }}", github-token: "${{ github.token }}" }
      - uses: actions/checkout@v4
        with: { path: code }
      - run: pip install -q pyarrow && python3 code/pipeline/public_strip.py nz   # never title references or types (T-106), whatever code built it
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          commit=$(python3 -c "import json; print(json.load(open('nz/provenance.json'))['commit'])")
          tag="national-$(date -u +%Y-%m-%d)-$RUN"
          gh release create "$tag" nz/index.parquet nz/provenance.json nz/run.json --repo "${{ github.repository }}" \
            --title "National index $(date -u +%Y-%m-%d)" \
            --notes "Every primary parcel in New Zealand from LINZ data (CC BY 4.0), built from $commit by run $RUN. Columns: SOURCES.md. Counts: run.json."
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main   # the map follows the newest index
