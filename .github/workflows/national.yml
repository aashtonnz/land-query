name: National index

# The national index (T-102): every parcel in New Zealand from LINZ data, built in shares of the
# 40 km tiles listed in pipeline/nz_tiles.json (`national_index.py plan` lists them again), merged, checked and
# published as a release file. Free: the repository is public (D-24). With source "bulk" (the default) one job first
# downloads every layer for the whole country (bulk.py: LINZ Data Service exports with the key, small layers from the
# ArcGIS services once), and the shares read only those files, so they make no requests to LINZ and can run 20 at once.

on:
  workflow_dispatch:
    inputs:
      shares:
        description: "How many jobs to split the tiles over"
        required: false
        default: "40"
      source:
        description: "bulk: download each layer once for the whole country (no rate limit); service: each tile queries LINZ's services"
        type: choice
        options: [bulk, service]
        default: bulk
      stop_after_bulk:
        description: "Only download the bulk layers and check them (a test of the download)"
        type: boolean
        default: false
      reuse_run:
        description: "Build faster on an earlier run's saved work (its run id, kept 5 days): the half not chosen under redo is taken from it"
        required: false
        default: ""
      redo:
        description: "With reuse_run: which half to work out again (the other is taken as saved)"
        type: choice
        options: ["vector,elevation", "vector", "elevation"]
        default: "vector,elevation"
      merge_run:
        description: "Instead of building: merge the shares an earlier run built (its run id; shares are kept 3 days)"
        required: false
        default: ""
      publish_run:
        description: "Instead of building: publish the index an earlier run built (its run id), once it has been reviewed"
        required: false
        default: ""

permissions:
  contents: write   # the release
  actions: read     # to fetch an earlier run's index (publish_run)

jobs:
  plan:
    if: inputs.publish_run == '' && inputs.merge_run == ''
    runs-on: ubuntu-latest
    outputs:
      shares: ${{ steps.s.outputs.shares }}
    steps:
      - id: s
        env: { N: "${{ inputs.shares }}" }
        run: python3 -c "import json, os; print('shares=' + json.dumps(list(range(int(os.environ['N'])))))" >> "$GITHUB_OUTPUT"

  bulk:
    if: inputs.publish_run == '' && inputs.merge_run == '' && inputs.source == 'bulk'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Download every layer once
        working-directory: pipeline
        env: { LINZ_API_KEY: "${{ secrets.LINZ_API_KEY }}" }
        run: |
          /usr/bin/time -v -o time.txt python3 bulk.py ../bulk
          grep -h -E "Elapsed|Maximum resident" time.txt; ls -la ../bulk; cat ../bulk/manifest.json
      - uses: actions/upload-artifact@v4
        with: { name: bulk, path: bulk/, retention-days: 2, compression-level: 0 }   # parquet is compressed already

  share:
    needs: [plan, bulk]
    if: always() && needs.plan.result == 'success' && !inputs.stop_after_bulk && (needs.bulk.result == 'success' || needs.bulk.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.source == 'bulk' && 20 || 6 }}   # bulk: no requests to LINZ; service: its rate limit is shared by every job
      matrix:
        k: ${{ fromJson(needs.plan.outputs.shares) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        if: inputs.source == 'bulk'
        with: { name: bulk, path: bulk }
      # an earlier run's work for this share: its saved halves (in share-K, under stages/)
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run != ''
        with: { name: "share-${{ matrix.k }}", path: share, run-id: "${{ inputs.reuse_run }}", github-token: "${{ github.token }}" }
      - name: Build this share
        working-directory: pipeline
        env:
          N: "${{ inputs.shares }}"
          K: "${{ matrix.k }}"
          NI_BULK: "${{ inputs.source == 'bulk' && '../bulk' || '' }}"
          NI_STAGES: ../share/stages
          NI_REDO: "${{ inputs.reuse_run != '' && inputs.redo || 'vector,elevation' }}"
        run: |
          python3 test_national.py
          rm -f ../share/index.parquet ../share/provenance.json ../share/run.json
          /usr/bin/time -v -o time.txt python3 national_index.py ../share nz nz_tiles.json "$K" "$N"   # errors stay in the log
          grep -h -E "Elapsed|Maximum resident" time.txt
          rm -rf ../share/cache   # raw downloads hold title references: never uploaded (T-106)
      - uses: actions/upload-artifact@v4
        with:
          name: share-${{ matrix.k }}
          path: share/
          retention-days: 5

  merge:
    needs: share
    # runs after the shares whether or not the bulk job before them was skipped (a skipped job upstream would skip this
    # one too: run 42774512412 built every share and merged nothing), or alone on an earlier run's shares (merge_run)
    if: always() && inputs.publish_run == '' && (needs.share.result == 'success' || inputs.merge_run != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        if: inputs.merge_run == ''
        with: { pattern: "share-*", path: shares }
      - uses: actions/download-artifact@v4
        if: inputs.merge_run != ''
        with: { pattern: "share-*", path: shares, run-id: "${{ inputs.merge_run }}", github-token: "${{ github.token }}" }
      - name: Merge and check
        run: python3 pipeline/national_merge.py shares nz "${{ inputs.shares }}"
      - uses: actions/upload-artifact@v4
        with: { name: national-index, path: nz/, retention-days: 30 }

  publish:
    # a build is published only once reviewed: run again with publish_run set to the build's run id
    if: inputs.publish_run != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: national-index, path: nz, run-id: "${{ inputs.publish_run }}", github-token: "${{ github.token }}" }
      - uses: actions/checkout@v4
        with: { path: code }
      - run: pip install -q pyarrow && python3 code/pipeline/public_strip.py nz   # never title references or types (T-106), whatever code built it
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          commit=$(python3 -c "import json; print(json.load(open('nz/provenance.json'))['commit'])")
          tag="national-$(date -u +%Y-%m-%d)-${{ inputs.publish_run }}"
          gh release create "$tag" nz/index.parquet nz/provenance.json nz/run.json --repo "${{ github.repository }}" \
            --title "National index $(date -u +%Y-%m-%d)" \
            --notes "Every primary parcel in New Zealand from LINZ data (CC BY 4.0), built from $commit by run ${{ inputs.publish_run }}. Columns: SOURCES.md. Counts: run.json."
