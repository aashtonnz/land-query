name: TopoNZ Autonomous Endpoint & Ecosystem Watchtower ($0 Cron)

on:
  schedule:
    - cron: '0 14 * * 0'  # Every Sunday 14:00 UTC (Monday 03:00 NZDT)
  workflow_dispatch:

jobs:
  watchtower-self-test-and-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout land-query repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NumPy
        run: pip install numpy

      - name: Run 96-Domain Spine Self-Test & 15-Pillar Cross-Check
        run: python3 toponz_weekend1_kapiti_ingester.py --self-test

      - name: Generate Sample 96-Domain Master Dossier
        run: python3 toponz_weekend1_kapiti_ingester.py --dossier LINZ-5041821
