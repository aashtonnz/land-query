name: Compile Kāpiti Coast

# Compiles every 5 km block listed in pipeline/kapiti_blocks.json (each parcel belongs to the block holding its
# representative point), then merges the blocks into one district database and runs the inverse queries (T-21).
# Uses the LINZ_API_KEY repository secret. Results are pushed to the `kapiti-results` branch.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated block xmin_ymin ids to run (default: all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      blocks: ${{ steps.b.outputs.blocks }}
    steps:
      - uses: actions/checkout@v4
      - id: b
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          only = {s.strip() for s in os.environ.get("ONLY", "").split(",") if s.strip()}
          b = [x for x in json.load(open("pipeline/kapiti_blocks.json")) if not only or f"{x['xmin']}_{x['ymin']}" in only]
          print("blocks=" + json.dumps([{"xmin": x["xmin"], "ymin": x["ymin"]} for x in b]))
          EOF
        env:
          ONLY: ${{ inputs.only }}

  block:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8   # gentle on council map servers
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks) }}
    env:
      TILE_XMIN: ${{ matrix.block.xmin }}
      TILE_YMIN: ${{ matrix.block.ymin }}
      TILE_SIZE: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch and compile
        working-directory: pipeline
        env:
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
        run: |
          python3 fetch_parcels_kcdc.py data
          python3 fetch_tile.py data
          python3 fetch_lidar.py data
          python3 fetch_parcels.py data
          /usr/bin/time -v python3 compile_tile.py data 2> time_compile.txt
          python3 qa.py data
          grep -h -E "Elapsed|Maximum resident" time_compile.txt
      - uses: actions/upload-artifact@v4
        with:
          name: block-${{ matrix.block.xmin }}_${{ matrix.block.ymin }}
          path: |
            pipeline/data/units.parquet
            pipeline/data/provenance.json
            pipeline/data/qa.json
            pipeline/data/fetch_bbox.json
          retention-days: 7

  merge:
    needs: block
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "block-*", path: blocks }
      - name: Merge and query
        working-directory: pipeline
        run: |
          mkdir -p ../district && python3 merge_blocks.py ../blocks ../district | tee ../district/merge_log.txt
          python3 inverse_queries.py ../district ../district/district.duckdb | tee ../district/summary.md
      - name: Push results to kapiti-results branch
        run: |
          mkdir -p /tmp/out && cp district/{units.parquet,blocks.json,qa_summary.json,inverse_queries.json,summary.md,merge_log.txt} /tmp/out/
          git fetch origin kapiti-results && git checkout kapiti-results || git checkout --orphan kapiti-results
          git rm -rq --cached . 2>/dev/null || true
          rm -rf results && mkdir -p results && cp /tmp/out/* results/
          echo "Run ${{ github.run_id }} on $(date -u +%FT%TZ)" > results/RUN.txt
          git add results && git -c user.name="kapiti workflow" -c user.email="actions@github.com" \
            commit -qm "Kāpiti compile: run ${{ github.run_id }}" && git push -q origin HEAD:kapiti-results
